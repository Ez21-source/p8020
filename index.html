<style>[hidden]{display:none!important}
:root{--navy:#0B3C6B;--blue:#1478B8;--blue2:#1691CF;--sky:#2BAAE1;--green:#3F8F2A;--green2:#6DB33F;--red:#D92D3A;--amber:#B7791F;
--bg:#F2F6FA;--card:#fff;--ink:#14263A;--muted:#5B6F82;--line:#DCE6EF;--soft:#E8F1F8;--trivial:#C9D8E6;
--f:"Janna LT",system-ui,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:800}
.top .sub{font-size:12.5px;opacity:.8}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 16px 0;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:var(--toph,52px);z-index:15}
.tabs button{border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.filters{padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
.filters summary{cursor:pointer;font-size:13.5px;color:var(--navy);padding:2px 0}
.filters summary span{color:var(--muted);font-weight:400}
.filters .fwrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:8px 0 4px}
@media(max-width:700px){.filters .fwrap .fld{flex:1 1 140px}.filters .fwrap select.inp{max-width:none}}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.inp{border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#fff;min-width:0}
select.inp{max-width:260px}
.presets{display:flex;gap:4px;flex-wrap:wrap}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 4px;color:var(--navy)}
.card .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:700}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy);line-height:1.2;direction:ltr;text-align:right}
.kpi .s{font-size:12.5px;color:var(--muted)}
.chg{font-weight:800;font-size:13px;direction:ltr;display:inline-block;unicode-bidi:isolate}
.up-bad,.down-bad{color:var(--red)} .down-good,.up-good{color:var(--green)} .flat{color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:var(--soft);color:var(--navy);text-align:right;padding:7px 8px;font-weight:800;position:sticky;top:0}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:center;direction:ltr;white-space:nowrap}
table.t tr.vf td:first-child{box-shadow:inset -4px 0 0 var(--blue)}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--navy)}
.pill.vf{background:var(--blue);color:#fff}
.pill.warn{background:#FCE8EA;color:var(--red)}
.pill.ok{background:#E6F4E0;color:var(--green)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty b{display:block;font-size:18px;color:var(--navy);margin-bottom:6px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ins div{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px}
.ins b{color:var(--navy)}
.heat td.c{text-align:center;direction:ltr;font-weight:700;min-width:46px;border:2px solid #fff}
.heat th.v{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px;padding:6px 2px;max-height:180px;vertical-align:bottom}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
#tip{position:fixed;z-index:99;pointer-events:none;background:#14263A;color:#fff;padding:6px 10px;border-radius:8px;font-size:12.5px;max-width:320px;display:none;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14263A;color:#fff;padding:9px 16px;border-radius:10px;z-index:100;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(10,25,40,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg>div{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
.dlg h3{margin:0 0 10px;color:var(--navy)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:14px;flex-wrap:wrap}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:95;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:16px}
/* infographic builder */
.ig{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.ig{grid-template-columns:1fr}}
.igset{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
.igset .fld{margin-bottom:8px}
.igset .inp{width:100%;max-width:none}
.sl{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.sl span{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:6px 0;cursor:pointer;font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.pvw{overflow:auto}
.pgwrap{margin:0 auto 18px;box-shadow:0 6px 22px rgba(11,60,107,.16);background:#fff;transform-origin:top right}
/* page (infographic) */
.page{background:#fff;color:var(--ink);font-family:var(--f);display:flex;flex-direction:column;overflow:hidden;position:relative}
.page .ph{display:flex;align-items:center;gap:14px;padding:5mm 8mm 3mm;border-bottom:1.2mm solid var(--pc,#0B3C6B)}
.page .ph img{height:14mm;max-width:45mm;object-fit:contain}
.page .ph .tt{flex:1;text-align:center}
.page .ph .tt b{display:block;font-size:var(--h1,6mm);color:var(--pc,#0B3C6B);line-height:1.3}
.page .ph .tt span{font-size:var(--h2,3.6mm);color:var(--blue)}
.page .ph .org{font-size:3mm;line-height:1.35;color:var(--muted);min-width:40mm}
.page .ph .org b{color:var(--pc,#0B3C6B);display:block}
.page .grid{flex:1;display:grid;gap:4mm;padding:4mm 6mm;min-height:0}
.page .sld{border:0.3mm solid var(--line);border-radius:3mm;padding:3mm 4mm;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:#fff}
.page .sld h4{margin:0 0 1.5mm;font-size:var(--st,4.2mm);color:var(--pc,#0B3C6B);display:flex;align-items:center;gap:2mm}
.page .sld h4 em{font-style:normal;background:var(--pc,#0B3C6B);color:#fff;border-radius:1.5mm;padding:0 2mm;font-size:.8em}
.page .sld .sd{font-size:calc(var(--st,4.2mm)*.62);color:var(--muted);margin:0 0 1.5mm}
.page .sld .body{flex:1;min-height:0;position:relative;overflow:hidden}
.page .sld .body>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.page .sld .body.tp{overflow:hidden}
.page .pf{display:flex;justify-content:space-between;align-items:center;background:var(--pc,#0B3C6B);color:#fff;font-size:3mm;padding:2mm 8mm;font-weight:400}
.page .kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm}
.page .kgrid div{background:var(--soft);border-radius:2mm;padding:2mm 3mm;text-align:center}
.page .kgrid b{display:block;font-size:calc(var(--st,4.2mm)*1.5);color:var(--pc,#0B3C6B);direction:ltr}
.page .kgrid span{font-size:calc(var(--st,4.2mm)*.6);color:var(--muted)}
.page .ilist{margin:2mm 0 0;padding:0;list-style:none;display:grid;gap:1.5mm;font-size:calc(var(--st,4.2mm)*.7)}
.page .ilist li{background:#F6F9FC;border-right:1mm solid var(--blue);padding:1.2mm 2.5mm;border-radius:1mm}
.page table.mt{width:100%;border-collapse:collapse;font-size:calc(var(--st,4.2mm)*.66)}
.page table.mt th{background:var(--soft);color:var(--pc,#0B3C6B);padding:.8mm 1.5mm;text-align:right}
.page table.mt td{padding:.7mm 1.5mm;border-bottom:.2mm solid var(--line)}
.page table.mt td.n{text-align:center;direction:ltr;white-space:nowrap}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .page{page-break-after:always;break-after:page}
}
#printArea{display:none}
</style>

function renderPreview(){ const box=$('#pvw'); if(!box) return; if(!sets().cur.length){ box.innerHTML='<div class="card empty"><b>لا توجد بلاغات في الفترة المحددة</b></div>'; return; } box.innerHTML=igPages().map(p=>`<div class="pgwrap">${p}</div>`).join(''); fillSlides(box); requestAnimationFrame(fitPreview); }
function fillSlides(root){ const PX=96/25.4; $$('.body[data-sid]',root).forEach(b=>{ const w=b.clientWidth/PX, h=b.clientHeight/PX; const s=igSlide(b.dataset.sid,Math.max(20,w),Math.max(15,h)); b.innerHTML=s.b; }); }
async function pagePNGs(){ const pages=$$('#pvw .page'); const out=[]; for(const pg of pages){ const tr=pg.style.transform; pg.style.transform='none'; try{ out.push(await htmlToImage.toPng(pg,{pixelRatio:2.5,backgroundColor:'#fff',fontEmbedCSS:FONT_CSS,width:pg.offsetWidth,height:pg.offsetHeight})); } finally{ pg.style.transform=tr; } } return out; }
const fileBase=()=>`انفوجرافيك-80-20-${(F.sec?shortSec(F.sec):'التجمع').replace(/[\\\/:*?"<>|\s]+/g,'-')}-${F.from}_${F.to}`;
async function exportPDF(){ busy('جارٍ تجهيز ملف PDF…'); try{ const imgs=await pagePNGs(); const [pw0,ph0]=PAGE_MM[IG.size]; const [pw,ph]=IG.orient==='port'?[ph0,pw0]:[pw0,ph0]; const doc=await PDFLib.PDFDocument.create(); doc.setTitle(IG.title);
  for(const u of imgs){ const png=await doc.embedPng(u); const pg=doc.addPage([pw*2.8346,ph*2.8346]); pg.drawImage(png,{x:0,y:0,width:pw*2.8346,height:ph*2.8346}); }
  const bytes=await doc.save(); busy(); await saveFile(fileBase()+'.pdf',new Blob([bytes],{type:'application/pdf'})); }catch(e){ busy(); dialog({title:'تعذر إنشاء PDF',html:`<p>${esc(e.message||e)}</p><p>جرّب زر «طباعة» ثم اختر «حفظ كـ PDF».</p>`}); } }
async function exportPNG(){ busy('جارٍ تجهيز الصور…'); try{ const imgs=await pagePNGs(); busy(); for(let i=0;i<imgs.length;i++){ const b=await (await fetch(imgs[i])).blob(); await saveFile(fileBase()+(imgs.length>1?`-${i+1}`:'')+'.png',b); } }catch(e){ busy(); toast('تعذر حفظ الصورة'); } }
function doPrint(){ const [pw0,ph0]=PAGE_MM[IG.size]; const [pw,ph]=IG.orient==='port'?[ph0,pw0]:[pw0,ph0]; let st=$('#pgsize'); if(!st){ st=document.createElement('style'); st.id='pgsize'; document.head.appendChild(st); } st.textContent=`@page{size:${pw}mm ${ph}mm;margin:0}`;
  const pa=$('#printArea'); pa.innerHTML=$$('#pvw .page').map(p=>{ const c=p.cloneNode(true); c.style.transform=''; return c.outerHTML; }).join(''); setTimeout(()=>{ window.print(); },150); }

/* ================= shell ================= */
function fillFilters(){ const recs=DATA.recs; const opt=(v,l,s)=>`<option value="${esc(v)}"${s?' selected':''}>${esc(l)}</option>`;
  const secs=[...countBy(recs,'sec')].sort((a,b)=>b[1]-a[1]); if(F.sec&&!secs.some(s=>s[0]===F.sec)) F.sec='';
  $('#fSec').innerHTML=opt('','تجمع مكة المكرمة الصحي (كل القطاعات)',!F.sec)+secs.map(([s,n])=>opt(s,`${shortSec(s)} (${fmt(n)})`,s===F.sec)).join('');
  const cl=recs.filter(r=>!F.sec||r.sec===F.sec); const cens=[...countBy(cl,'cen')].sort((a,b)=>a[0].localeCompare(b[0],'ar')); if(F.cen&&!cens.some(s=>s[0]===F.cen)) F.cen='';
  $('#fCen').innerHTML=opt('','كل المراكز',!F.cen)+cens.map(([s,n])=>opt(s,`${s} (${fmt(n)})`,s===F.cen)).join('');
  const ml=cl.filter(r=>!F.cen||r.cen===F.cen); const mains=[...countBy(ml,'main')].sort((a,b)=>b[1]-a[1]); if(F.main&&!mains.some(s=>s[0]===F.main)) F.main='';
  $('#fMain').innerHTML=opt('','كل التصنيفات الرئيسية',!F.main)+mains.map(([s,n])=>opt(s,`${s} (${fmt(n)})`,s===F.main)).join('');
  $('#fFrom').value=F.from; $('#fTo').value=F.to; $('#fCmp').value=F.cmp; $('#fThr').value=F.thr; $('#cmpBox').hidden=F.cmp!=='custom'; $('#fCf').value=F.cfrom; $('#fCt').value=F.cto;
  const cp=cmpPeriod(); $('#cmpInfo').textContent=cp?`${arDate(cp[0])} – ${arDate(cp[1])}`:''; $('#fsum').textContent=F.from?`${arDate(F.from)} – ${arDate(F.to)} · ${scopeLabel()}${cp?' · مقارنة':''}`:''; }
function render(){ const v=$('#view'); $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB)); $('#filters').hidden=TAB==='data';
  if(!DATA.recs.length&&TAB!=='data'){ v.innerHTML=`<div class="card empty"><b>ابدأ باستيراد البلاغات</b>اسحبها مباشرة من قاعدة البلاغات، أو استورد ملف Excel.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="pull">⇩ سحب من قاعدة البلاغات</button><button class="btn" data-act="file">استيراد ملف</button></div></div>`; return; }
  const S=sets(); $('#sumLine').textContent=DATA.recs.length?`${fmt(S.cur.length)} بلاغ في الفترة · ${scopeLabel()}`:'';
  v.innerHTML={sum:viewSum,pareto:viewPareto,heat:viewHeat,cmp:viewCmp,spc:viewSPC,ig:viewIG,data:viewData}[TAB]();
  if(TAB==='ig') renderPreview(); }
function preset(p){ const [a,b]=dataRange(); if(!b) return; const L=pd(b); let f,t;
  if(p==='m'){ f=iso(new Date(L.getFullYear(),L.getMonth(),1)); t=b; } else if(p==='pm'){ f=iso(new Date(L.getFullYear(),L.getMonth()-1,1)); t=iso(new Date(L.getFullYear(),L.getMonth(),0)); }
  else if(p==='3m'){ f=iso(new Date(L.getFullYear(),L.getMonth()-2,1)); t=b; } else if(p==='w'){ const s=pd(bucketKey(b,'week')); f=iso(s); t=b; } else if(p==='pw'){ const s=pd(bucketKey(b,'week')); s.setDate(s.getDate()-7); f=iso(s); t=addD(f,6); } else { f=a; t=b; }
  F.from=f<a?a:f; F.to=t; saveF(); CACHE=null; fillFilters(); render(); }
let FONT_CSS='';
async function init(){ FONT_CSS=$('#fontEmb').textContent; await openStore(); const d=await kvGet('data'); if(d&&Array.isArray(d.recs)) DATA=d; const pj=await kvGet('proj'); if(pj) PROJ=pj; if(DATA.recs.length&&!F.from) defaultPeriod();
  document.documentElement.style.setProperty('--toph',$('.top').offsetHeight+'px'); if(window.innerWidth>900) $('#filters').open=true; fillFilters(); if(!DATA.recs.length) TAB='data'; render();
  document.addEventListener('click',async e=>{ const t=e.target.closest('[data-tab],[data-act],[data-pre],[data-ig],[data-igmv]'); if(!t) return;
    if(t.dataset.tab){ TAB=t.dataset.tab; render(); window.scrollTo({top:0}); return; }
    if(t.dataset.pre){ preset(t.dataset.pre); return; }
    if(t.dataset.ig){ IG[t.dataset.ig]=isNaN(+t.dataset.val)?t.dataset.val:+t.dataset.val; saveIG(); render(); return; }
    if(t.dataset.igmv!=null){ const i=+t.dataset.igmv, j=i+(+t.dataset.d); [IG.order[i],IG.order[j]]=[IG.order[j],IG.order[i]]; saveIG(); render(); return; }
    const a=t.dataset.act;
    if(a==='pull') doPull(); if(a==='file') $('#fileIn').click();
    if(a==='backup') saveFile(`مشروع-80-20-نسخة-${iso(new Date())}.json`,new Blob([JSON.stringify({kind:'p8020-backup',v:1,at:new Date().toISOString(),src:DATA.src,recs:DATA.recs,ig:{...IG,logo:IG.logo},proj:PROJ})],{type:'application/json'}));
    if(a==='clear') dialog({title:'مسح البيانات',html:'<p>ستُحذف البلاغات المستوردة من هذا التطبيق فقط، ولا تتأثر قاعدة البلاغات.</p>',actions:[{label:'مسح',pri:1,run:async()=>{ DATA={recs:[],src:'',at:''}; await kvSet('data',DATA); CACHE=null; F={...DEF_F}; saveF(); fillFilters(); render(); }},{label:'إلغاء'}]});
    if(a==='logo') $('#logoIn').click(); if(a==='nologo'){ IG.logo=''; saveIG(); render(); }
    if(a==='pdf') exportPDF(); if(a==='png') exportPNG(); if(a==='print') doPrint();
    if(a==='igreset'){ const logo=IG.logo; IG={...DEF_IG,on:{...DEF_IG.on},order:[...DEF_IG.order],logo}; saveIG(); render(); }
  });
  document.addEventListener('change',e=>{ const t=e.target;
    if(t.dataset.v){ VIEW[t.dataset.v]=t.type==='number'?(+t.value||0):t.value; if(t.dataset.v==='sdim') VIEW.sval=''; saveV(); render(); return; }
    if(t.dataset.igon){ IG.on[t.dataset.igon]=t.checked?1:0; saveIG(); render(); return; }
    if(t.dataset.igc){ IG[t.dataset.igc]=t.checked?1:0; saveIG(); render(); return; }
    if(t.dataset.igi){ IG[t.dataset.igi]=t.type==='number'?(+t.value||10):t.value; saveIG(); renderPreview(); return; }
    const fm={fFrom:'from',fTo:'to',fCmp:'cmp',fSec:'sec',fCen:'cen',fMain:'main',fThr:'thr',fCf:'cfrom',fCt:'cto'}[t.id];
    if(fm){ F[fm]=fm==='thr'?Math.max(50,Math.min(95,+t.value||80)):t.value; if(fm==='sec'){ F.cen=''; F.main=''; } if(fm==='cen') F.main=''; if(F.from&&F.to&&F.from>F.to) [F.from,F.to]=[F.to,F.from]; saveF(); CACHE=null; fillFilters(); render(); }
  });
  $('#fileIn').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; if(f) importFile(f); });
  $('#logoIn').addEventListener('change',e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'), s=Math.min(1,400/img.height); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); IG.logo=c.toDataURL('image/png'); saveIG(); render(); }; img.src=r.result; }; r.readAsDataURL(f); });
  const T=$('#tip'); document.addEventListener('pointermove',e=>{ const g=e.target.closest&&e.target.closest('[data-tip]'); if(!g){ T.style.display='none'; return; } T.textContent=g.dataset.tip; T.style.whiteSpace='pre-line'; T.style.display='block'; const x=Math.min(window.innerWidth-T.offsetWidth-8,e.clientX+14), y=e.clientY+16+T.offsetHeight>window.innerHeight?e.clientY-T.offsetHeight-10:e.clientY+16; T.style.left=Math.max(8,x)+'px'; T.style.top=y+'px'; });
  window.addEventListener('resize',()=>{ document.documentElement.style.setProperty('--toph',$('.top').offsetHeight+'px'); fitPreview(); });
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude|anthropic|artifact/i.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
